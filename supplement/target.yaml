target_id: additive-two-matroid-rank-four
search_date: 2026-11-02
intended_contribution_unit: theorem and analytic proof
claim:
  exact_statement: |
    Let I be a nonempty downset of 2^V, |V|=n, satisfying:
    S,T in I and |T| >= |S|+2 imply S union {x} in I for some x in T minus S.
    For every choice of nonnegative activities w_v, the product-weight measure
    on I has CAPP and its rank sequence is ULC with normalization binomial(n,k)
    whenever max{|S|:S in I} <= 4, or whenever n <= 7.
    For arbitrary rank and n, the first five normalized weighted coefficients
    (indices 0 through min(4,n)) are log-concave.
    The essential local statement is 3|F_3| >= 4|F_2| on six elements, where
    F_j consists of feasible j-sets with feasible complement.
  exclusions:
    - No claim to prove the unrestricted additive 2-matroid conjecture.
    - Not Bouchet multimatroids, rank-two matroids, or 2-polymatroids.
    - No new claim for ordinary-matroid ULC or the general CAPP-to-ULC criterion.
    - No historical-priority claim follows from this bounded gate.
source:
  originating_reference: "Xie–Xu (2026), Ultra log-concavity and real-rootedness of dependence polynomials, Proposition 4.2 and Conjecture 4.4, arXiv v2"
  url: "https://arxiv.org/html/2408.09152v2"
normalisation:
  indices: "n is ground-set size; rank r is maximum feasible-set size; augmentation parameter is 2."
  scaling: "Weighted coefficients divided by binomial(n,k), including trailing zero coefficients."
  basis_order: "Not applicable; this is a class of downsets, not a particular matrix."
  symmetries: ["ground-set relabelling", "F_j = complement(F_(n-j))"]
sequences:
