target_id: graph-dependence-ulc
search_date: 2026-11-02
intended_contribution_unit: theorem
current_scope: weighted rank theorem and stronger conditional antipodal-pairs unimodality
claim:
  exact_statement: |
    For every finite simple graph G on n vertices with at least one edge, let
    d_k count k-subsets inducing at least one edge. For 1 <= k <= n-1,
    k(n-k)d_k^2 >= (k+1)(n-k+1)d_{k-1}d_{k+1}.
    Equivalently d_k/binomial(n,k) is log-concave.
  exclusions:
    - Ordinary log-concavity is known (Horrocks 2002).
    - Special cases of Xie-Xu 2026 are known.
    - Numerical evidence alone does not resolve the conjecture.
strengthened_claims:
  weighted_rank: |
    For an increasing family U on n elements generated by witnesses of size
    one or two, and arbitrary nonnegative weights w_v, define
    A_k = sum_{S in U, |S|=k} product_{v in S} w_v. Then
    k(n-k)A_k^2 >= (k+1)(n-k+1)A_{k-1}A_{k+1} for 1 <= k < n.
  normalised_antipodal_pairs: |
    If b_k counts k-sets S such that S and its complement both belong to U,
    then b_k/binomial(n,k) is symmetric and unimodal. Equivalently,
    k b_k >= (n-k+1)b_{k-1} for 1 <= k <= floor(n/2).
  conditional_weighted_form: |
    The positive product-weight measure supported on a nonempty U is CAPU.
    Every positive-probability coordinate conditioning stays in the class
    of singleton-and-pair-generated families, or becomes the full family.
  contribution_boundary: |
    Katona's intersecting-shadow theorem and the Kahn-Neiman implication
    are established inputs. Weight cancellation and conditioning yield the
    weighted theorem from the antipodal result; they are not separate
    unrelated breakthroughs. Equivalent noncover-complex formulations are
    translations of the same result.
  sharpness: |
    Generalisation to witnesses of maximum size three fails, even without
    weights. The weighted conclusion also fails for two disjoint triples
    on six elements, and six is the minimum positive-weight uniform-three
    counterexample size. These are boundary results, not separate claims
    to have solved an identified open problem.
separate_supplement:
  claim: weighted ULC for additive 2-matroids of rank at most four or on at most seven elements
  method: analytic six-element APP lemma using the main graph APU theorem, then Kahn-Neiman
  further_corollary: first three order-n ULC inequalities for every additive 2-matroid, by rank-four truncation
  computational_role: complete six-element enumeration retained only as a corroborating check
  priority_status: limited novelty screen only; no historical-priority claim
source:
